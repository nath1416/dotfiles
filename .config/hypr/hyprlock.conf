# -------


general {
    hide_cursor = true
    ignore_empty_input = true
}

 auth {
     fingerprint {
         enabled = true
         ready_message = Scan fingerprint to unlock
         present_message = Scanning...
         retry_delay = 250 
     }
 }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    color = $on_primary
    monitor =
    path = /home/nathan/wallpapers/wallhaven-qz13pl.jpg
    reload_time = 0
    blur_passes = 3 
    blur_size = 5
    brightness = 0.6
}

# Time and Date Laptop
label {
    monitor = desc:Chimei Innolux Corporation 0x1417
    text = cmd[update:60000] date +"%A, %d %B %Y" 
    font_size = 25
    font_family = $font
    color = $on_background

    position = 0, 500
    halign = center
    valign = center
}
label {
    monitor = desc:Chimei Innolux Corporation 0x1417
    text = $TIME 
    font_size = 120
    font_family = $font
    color = $on_background
    position = 0, 340
    halign = center
    valign = center
}

