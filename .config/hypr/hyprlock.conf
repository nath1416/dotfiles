input-field {
    monitor = desc:Chimei Innolux Corporation 0x1417
    size = 20%, 5%
    outline_thickness = 2

    inner_color = $primaryContainer30
    outer_color = $onPrimaryRgbA90
    font_color = $onPrimaryRgbA75

    capslock_color = $onSecondaryContainer75

    fade_on_empty = false
    rounding = 10

    placeholder_text = 
    fail_text = $PAMFAIL

    dots_size = 0.4
    dots_spacing = 0.3

    position = 0, -50
    halign = center
    valign = center
}

